name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Add official MGSU logo
        shell: bash
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          curl -L --fail --retry 2 \
            "https://raw.githubusercontent.com/broman77/Mgsu_shedule/main/app/src/main/res/drawable-nodpi/official_mgsu_logo.png" \
            -o app/src/main/res/drawable-nodpi/mgsu_logo.png || true

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MGSU-Schedule-Molotkova-PA-v0.2.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Run unit tests
        continue-on-error: true
        run: gradle testDebugUnitTest
